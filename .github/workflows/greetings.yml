name: Community Greetings

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: First Interaction Greeting
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Welcome to the project and thank you for opening your first issue!

            We appreciate your contribution. Please provide all relevant details,
            logs, screenshots, and reproduction steps where applicable.

            A maintainer will review your issue shortly.

            Thank you for helping improve this project! 🚀

          pr-message: |
            🎉 Thank you for submitting your first Pull Request!

            Please ensure your changes are well described and all checks pass.

            A maintainer will review your contribution soon.

            Welcome to the community! 🚀

      - name: Add labels to new issues
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-triage']
            })

      - name: Add labels to new pull requests
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['review-required']
            })

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "GitHub Notification - ${{ github.repository }}"
          to: langatamosa@gmail.com
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          body: |
            Repository: ${{ github.repository }}
            Event: ${{ github.event_name }}
            User: ${{ github.actor }}

            Title:
            ${{ github.event.issue.title || github.event.pull_request.title }}

            Link:
            ${{ github.event.issue.html_url || github.event.pull_request.html_url }}
