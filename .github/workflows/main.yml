 name: Amos Greetings
on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]
jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: First Interaction Greeting
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Welcome to the project and thank you for opening your first issue!
            We appreciate your contribution. Please ensure you:
            - Provide clear reproduction steps
            - Include logs/screenshots where applicable
            - Review our contribution guidelines
            A maintainer will review your issue shortly.
            Thank you for helping improve this project! 🚀
          pr-message: |
            🎉 Thank you for submitting your first Pull Request!
            Before review, please ensure that:
            A maintainer will review your contribution soon.
            Welcome to the community! 🚀
      - name: Add labels to new issues
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-triage']
            })


      - name: Add labels to new pull requests
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['review-required']
            })

